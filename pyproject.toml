[project]
name = "graphs"
version = "0.1.0"
description = "Graph representations and basic graph checks (DS2 - Entrega 1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphs"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
